# ~chewygumxx/sync-header-metadata.git
# ::: :/mise.toml
#
#

#
# https://mise.jdx.dev/configuration.html
#
# The development toolchain for this repository, in one place.
#
# Everything the repository runs that is not an npm package lives here, so
# a checkout never depends on whatever the contributor happens to have on
# `PATH`. npm packages (commitlint, Biome, remark, prettier, husky,
# TypeScript) are pinned in `package.json` instead; together the two files
# are the whole dependency surface. CI installs from this file via
# `jdx/mise-action`, so the versions below are the ones CI runs.
#
# Backends are named explicitly rather than relying on the registry alias,
# so the resolution is visible here and cannot change underneath the pin.
#

min_version = "2026.9.0"

[tools]
#
# Runtimes
#
node = "24"

#
# Utilities
#
# `jq` parses the tool payload in `.claude/hooks/prohibit-em-dash.sh`.
#
"aqua:jqlang/jq" = "1"

#
# YAML
#
# yamllint is a Python tool, installed with the uv pinned beside it. Its
# rules come from `.yamllint.yaml`, which extends `@chewygumxx/yamllint-config`
# in `package.json`; prettier, which formats YAML, is an npm package pinned
# there too.
#
"aqua:astral-sh/uv" = "0.12.19"
"pypi:yamllint"     = "1.38.0"
