#
#
# ~chewygumxx/sync-header-metadata.git
# ::: :/.github/workflows/release.yaml
#
#

# release-please keeps a "chore: Release vX.Y.Z" PR open against main,
# bumping package.json (and .release-please-manifest.json) by the
# conventional commits since the last release. Merging it tags `vX.Y.Z` and
# creates the GitHub Release; this workflow then moves the floating major
# tag (`v2`) that the Action's users pin, and dispatches publish.yaml on the
# new tag to stage the CLI on npm.
#
# A tag pushed with GITHUB_TOKEN triggers no workflow, so publish.yaml is
# dispatched instead (workflow_dispatch is exempt). It stays the top-level
# workflow, which npm trusted publishing checks the OIDC token against.
#
# Opening the release PR requires Settings > Actions > General > "Allow
# GitHub Actions to create and approve pull requests". A PR opened by
# GITHUB_TOKEN doesn't trigger CI either; it only bumps the version, but
# closing and reopening it runs CI if wanted.

name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write

        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            major: ${{ steps.release.outputs.major }}
            sha: ${{ steps.release.outputs.sha }}

        steps:
            - name: Release Please
              id: release
              uses: googleapis/release-please-action@v5

    major-tag:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Move Major Tag
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: v${{ needs.release-please.outputs.major }}
                  SHA: ${{ needs.release-please.outputs.sha }}
              run: |
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
                      gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                          -f sha="$SHA" -F force=true
                  else
                      gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                          -f ref="refs/tags/$TAG" -f sha="$SHA"
                  fi

    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest

        permissions:
            actions: write

        steps:
            - name: Dispatch Publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ needs.release-please.outputs.tag_name }}
              run: gh workflow run publish.yaml -R "$GITHUB_REPOSITORY" --ref "$TAG"
