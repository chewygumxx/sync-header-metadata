#
#
# ~chewygumxx/sync-header-metadata.git
# ::: :/.github/workflows/publish.yaml
#
#

# Stages the CLI on npm for each exact `vX.Y.Z` release tag, if it matches
# package.json's version. The floating major tag (`v2`) that the Action's
# users pin is not matched, so moving it never republishes.
#
# A staged version is not installable until it is approved on npmjs.com
# with the maintainer's 2FA, so this workflow alone can never release.
#
# Authentication is npm trusted publishing: npm exchanges this job's OIDC
# token for a short-lived credential, so no NPM_TOKEN secret exists. The
# package must first be published once by hand, then have this repository
# and workflow added under its npm Settings > Trusted Publisher with the
# stage publish permission.

name: Publish

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check:
        uses: chewygumxx/.github/.github/workflows/lint.yaml@v1

    publish:
        needs: check
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Bun and Node
              uses: jdx/mise-action@v4

            - name: Verify Version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  actual=$(bun -p "require('./package.json').version")
                  test "v$actual" = "$TAG" || { echo "::error::package.json is $actual, tag says $TAG"; exit 1; }

            # npm, from mise's Node: Bun cannot stage a publish or publish by
            # trusted publishing.
            - name: Publish
              run: npm stage publish
