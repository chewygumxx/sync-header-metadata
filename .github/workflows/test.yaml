name: Test

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  cache: npm
                  node-version: 20

            - name:  NPM Test
              shell: bash
              run: |
                npm ci
                npm test
