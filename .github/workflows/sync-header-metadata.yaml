name: Sync Header Metadata

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Verify tracked files
              uses: chewygumxx/sync-header-metadata@v1
              with:
                  mode: verify
                  verbose: 'true'

    update:
        runs-on: ubuntu-latest

        # contents: write has no effect on a pull_request from a fork; the
        # commit step below will fail to push there.
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  verbose: 'true'
                  persist-credentials: true

            - name: Update tracked files
              uses: chewygumxx/sync-header-metadata@v1
              with:
                  mode: update

            - name: Commit changes
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: "chore: Sync header metadata"
